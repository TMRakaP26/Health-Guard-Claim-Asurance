name: healthguard

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-healthguard}
      MYSQL_USER: ${DB_USERNAME:-healthguard}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the root .env file}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    build:
      context: ./Health_Guard-backend
    restart: unless-stopped
    environment:
      APP_NAME: HealthGuard
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-healthguard}
      DB_USERNAME: ${DB_USERNAME:-healthguard}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_KEY: ${APP_KEY:-}
      SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-480}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      FEATURE_EMAIL: ${FEATURE_EMAIL:-false}
      FEATURE_REALTIME: ${FEATURE_REALTIME:-false}
      CLAIM_SLA_HOURS: ${CLAIM_SLA_HOURS:-72}
      FEATURE_PAYMENTS: ${FEATURE_PAYMENTS:-true}
      FEATURE_MESSAGES: ${FEATURE_MESSAGES:-true}
      FEATURE_RETENTION: ${FEATURE_RETENTION:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      MAIL_MAILER: ${MAIL_MAILER:-array}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-healthguard@example.test}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    volumes:
      - appdata:/var/www/appdata
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/health/ready]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    build:
      context: ./Health_Guard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HEALTHGUARD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail-dev]
    ports: ["127.0.0.1:8025:8025"]

volumes:
  dbdata:
  appdata:
  storage:
