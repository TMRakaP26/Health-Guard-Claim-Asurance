uatname: healthguard

services:
  backend:
    build:
      context: ./Health_Guard-backend
    restart: unless-stopped
    environment:
      APP_NAME: HealthGuard
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${HEALTHGUARD_PORT:-8080}
      FRONTEND_URL: http://localhost:${HEALTHGUARD_PORT:-8080}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/data/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      MAIL_MAILER: log
    volumes:
      - database:/var/www/data
      - storage:/var/www/html/storage
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/up]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  frontend:
    build:
      context: ./Health_Guard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HEALTHGUARD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  database:
  storage:
