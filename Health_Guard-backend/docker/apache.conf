<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    <LocationMatch "^/storage/documents(?:/|$)">
        Require all denied
    </LocationMatch>
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
